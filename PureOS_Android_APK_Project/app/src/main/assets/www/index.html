<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PureOS</title>
  <link rel="stylesheet" href="pureos_launch.css">
</head>
<body>
  <main class="pureos-launch" aria-label="PureOS launch screen">
    <div class="phone-status" aria-hidden="true">
      <span>9:41</span><span class="status-icons"><span></span><span></span><span></span></span>
    </div>
    <section class="launch-stage" aria-labelledby="pureos-title">
      <div class="brand-mark" aria-hidden="true">PURE</div>
      <h1 id="pureos-title">PURE OS</h1>
      <button id="launch-button" class="prism-launch" type="button" aria-label="Launch Pure OS">
        <span class="prism-field" aria-hidden="true">
          <span class="geometry geometry-one"></span>
          <span class="geometry geometry-two"></span>
          <span class="light-ray horizontal"></span>
          <span class="light-ray vertical"></span>
          <svg class="prism" viewBox="0 0 240 300" role="img" aria-label="PureOS prism">
            <defs>
              <linearGradient id="facetGold" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fff8d8"></stop>
                <stop offset="0.28" stop-color="#f7c45f"></stop>
                <stop offset="0.62" stop-color="#83bdff"></stop>
                <stop offset="1" stop-color="#fffaf0"></stop>
              </linearGradient>
              <linearGradient id="facetBlue" x1="1" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff"></stop>
                <stop offset="0.38" stop-color="#bcd2ff"></stop>
                <stop offset="0.72" stop-color="#a996ff"></stop>
                <stop offset="1" stop-color="#f6d47b"></stop>
              </linearGradient>
            </defs>
            <path d="M120 10 220 150 120 290 20 150 120 10Z" class="outline"></path>
            <path d="M120 10 120 150 20 150Z" fill="url(#facetBlue)" opacity=".60"></path>
            <path d="M120 10 220 150 120 150Z" fill="url(#facetGold)" opacity=".80"></path>
            <path d="M20 150 120 150 120 290Z" fill="url(#facetGold)" opacity=".55"></path>
            <path d="M220 150 120 150 120 290Z" fill="url(#facetBlue)" opacity=".72"></path>
            <path class="wire" d="M120 10 220 150 120 290 20 150 120 10ZM120 10v280M20 150h200M60 150l60-80 60 80M60 150l60 84 60-84"></path>
            <circle cx="120" cy="150" r="13" class="core"></circle>
          </svg>
        </span>
        <span class="launch-text">Launch Pure OS</span>
      </button>
    </section>
  </main>
  <script src="pureos_launch.js"></script>
</body>
</html>
