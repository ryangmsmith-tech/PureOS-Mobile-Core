name: PureRenderIR v0.10 Gold Ocean City Plaza Frame

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cloud/plaza-frame-v0-10
    paths:
      - 'native/PureRenderIRPlazaFrame/**'
      - '.github/workflows/purerenderir_plaza_frame.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'native/PureRenderIRPlazaFrame/**'
      - '.github/workflows/purerenderir_plaza_frame.yml'

permissions:
  contents: read

jobs:
  plaza-frame:
    name: Render Gold Ocean City multi-object plaza frame
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      XDG_RUNTIME_DIR: /tmp/pureos-xdg-runtime
      LIBGL_ALWAYS_SOFTWARE: '1'
      WGPU_BACKEND: vulkan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Vulkan software adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          LVP_ICD="$(find /usr/share/vulkan/icd.d -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$LVP_ICD"
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
          mkdir -p native/PureRenderIRPlazaFrame/dist
          VK_ICD_FILENAMES="$LVP_ICD" vulkaninfo --summary | tee native/PureRenderIRPlazaFrame/dist/vulkaninfo_summary.txt

      - name: Format source in runner workspace
        working-directory: native/PureRenderIRPlazaFrame
        run: cargo fmt --all

      - name: Run compiler and Clippy checks
        working-directory: native/PureRenderIRPlazaFrame
        run: cargo clippy --all-targets

      - name: Run scene and camera validation tests
        working-directory: native/PureRenderIRPlazaFrame
        run: cargo test --all-targets --verbose

      - name: Render plaza scene
        working-directory: native/PureRenderIRPlazaFrame
        run: cargo run --release -- assets/gold_ocean_city_plaza.pureir.scene.json dist

      - name: Verify plaza frame and receipt
        working-directory: native/PureRenderIRPlazaFrame
        run: |
          test -s dist/gold_ocean_city_plaza_vulkan_frame.png
          test -s dist/scene_frame_receipt.json
          test -s dist/adapter_report.json
          python3 - <<'PY'
          import json
          import struct
          from pathlib import Path

          png = Path('dist/gold_ocean_city_plaza_vulkan_frame.png').read_bytes()
          assert png[:8] == b'\x89PNG\r\n\x1a\n'
          width, height = struct.unpack('>II', png[16:24])
          assert (width, height) == (1024, 576), (width, height)

          receipt = json.loads(Path('dist/scene_frame_receipt.json').read_text())
          assert receipt['validation'] == 'passed'
          assert receipt['native_vulkan_offscreen_scene_frame_produced'] is True
          assert receipt['window_presented'] is False
          assert receipt['interactive_camera_enabled'] is False
          assert receipt['object_count'] >= 9
          assert receipt['draw_call_count'] == receipt['object_count']
          assert receipt['triangle_count'] >= 20
          assert receipt['non_background_pixels'] > 117000
          assert receipt['scene_id'] == 'GOC_PLAZA_BLOCKOUT_SCENE_001'

          adapter = json.loads(Path('dist/adapter_report.json').read_text())
          assert adapter['backend'] == 'Vulkan'
          print(json.dumps({
              'width': width,
              'height': height,
              'objects': receipt['object_count'],
              'draw_calls': receipt['draw_call_count'],
              'triangles': receipt['triangle_count'],
              'adapter': adapter,
          }, indent=2))
          PY
          sha256sum dist/gold_ocean_city_plaza_vulkan_frame.png dist/scene_frame_receipt.json dist/adapter_report.json > dist/SHA256SUMS.txt
          cat dist/scene_frame_receipt.json

      - name: Upload plaza-frame artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureRenderIR-v0.10-gold-ocean-city-plaza-frame
          path: native/PureRenderIRPlazaFrame/dist/**
          if-no-files-found: error
          retention-days: 30
