name: PureOS Android ARM64 Clean-Install APK Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/PureOSLaunchCandidate/**'
      - 'native/PureOSNativeRuntimeBootstrap/**'
      - '.github/workflows/pureos_android_debug_build.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build PureOS v17.49 Samsung ARM64 clean-install APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses and install SDK plus NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Test native runtime contract on host
        working-directory: native/PureOSNativeRuntimeBootstrap
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets --verbose

      - name: Build Rust JNI library for Android ARM64
        working-directory: native/PureOSNativeRuntimeBootstrap
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          rm -rf ../../android/PureOSLaunchCandidate/appv1749/src/main/jniLibs
          cargo ndk \
            --target arm64-v8a \
            --output-dir ../../android/PureOSLaunchCandidate/appv1749/src/main/jniLibs \
            build --release

      - name: Verify ARM64 native library
        run: |
          SO_FILE="android/PureOSLaunchCandidate/appv1749/src/main/jniLibs/arm64-v8a/libpureos_native_runtime_bootstrap.so"
          test -f "$SO_FILE"
          ls -lah "$SO_FILE"
          file "$SO_FILE"
          readelf -lW "$SO_FILE" | tee native_program_headers.txt
          grep -q '0x4000' native_program_headers.txt
          sha256sum "$SO_FILE" | tee native_library_sha256.txt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build clean-install debug APK
        working-directory: android/PureOSLaunchCandidate
        run: gradle :appv1749:clean :appv1749:assembleDebug --stacktrace --warning-mode all

      - name: Verify clean package and packaged ARM64 library
        run: |
          APK_DIR="android/PureOSLaunchCandidate/appv1749/build/outputs/apk/debug"
          APK_FILE="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_FILE"
          test "$(stat -c%s "$APK_FILE")" -gt 100000
          unzip -l "$APK_FILE" | tee apk_contents.txt
          grep -q 'lib/arm64-v8a/libpureos_native_runtime_bootstrap.so' apk_contents.txt
          strings "$APK_FILE" | grep -q 'com.pureos.mobilecore.s25.v1749'
          ls -lah "$APK_FILE"
          sha256sum "$APK_FILE" | tee apk_sha256.txt

      - name: Create build evidence packet
        if: always()
        run: |
          mkdir -p build-evidence
          cp native/PureOSNativeRuntimeBootstrap/runtime_manifest.json build-evidence/
          cp native/PureOSNativeRuntimeBootstrap/Cargo.toml build-evidence/
          cp apk_contents.txt build-evidence/ 2>/dev/null || true
          cp apk_sha256.txt build-evidence/ 2>/dev/null || true
          cp native_program_headers.txt build-evidence/ 2>/dev/null || true
          cp native_library_sha256.txt build-evidence/ 2>/dev/null || true
          printf '%s\n' 'package_id=com.pureos.mobilecore.s25.v1749' 'version=17.49' 'native_packaging=legacy_extract' > build-evidence/install_identity.txt

      - name: Upload clean-install Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PureOS-v17.49-samsung-s25-arm64-clean-install-apk
          path: android/PureOSLaunchCandidate/appv1749/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android clean-install build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PureOS-v17.49-samsung-s25-arm64-build-evidence
          path: build-evidence/**
          if-no-files-found: warn
          retention-days: 30
