[package]
name = "purerenderir-window-presentation"
version = "0.11.0"
edition = "2021"
description = "PureRenderIR v0.11 Gold Ocean City window presentation and interactive camera smoke test"
license = "Proprietary"
publish = false

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.15", features = ["derive"] }
image = { version = "0.24.9", default-features = false, features = ["png"] }
pollster = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
wgpu = "0.19.4"
winit = { version = "0.29.15", default-features = false, features = ["x11", "rwh_06"] }

[profile.release]
lto = "thin"
codegen-units = 1
